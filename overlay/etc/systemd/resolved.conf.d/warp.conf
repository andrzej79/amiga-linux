# Plain DNS from the DHCP-supplied server.
# DNSSEC: LAN forwarders (dnsmasq, Pi-hole, router DNS proxies) commonly accept
# the DO bit but return no validatable DNSKEYs, and with allow-downgrade every
# answer then fails with "DNSSEC validation failed: missing-key".
# DNS-over-TLS: no LAN resolver offers it, and the attempts cost a 68k dearly.
[Resolve]
DNSSEC=no
DNSOverTLS=no

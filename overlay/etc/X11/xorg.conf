# Xorg on the CS-Lab Warp RTG frame buffer (/dev/fb0).
#
# Driver "warp" (xdriver/ in the amiga-linux repo) uses the Warp's blitter,
# template blitter and hardware sprite.  To fall back to the plain fbdev
# driver, set Driver "fbdev" in the Device section.
#
# When troubleshooting, check /var/log/Xorg.0.log; the warp driver logs a
# "WARP(0): stats:" line when the server exits.

Section "Module"
   Load "fb"
   Load "shadow"
   Load "fbdevhw"
#   Load "evdev"
EndSection

Section "ServerLayout"
	Identifier	"DefaultLayout"
	InputDevice	"Keyboard0" "CoreKeyboard"
	InputDevice	"Mouse0" "CorePointer"
	Screen		"Screen0"
EndSection

Section "ServerFlags"
	Option		"AutoAddDevices" "false"
EndSection

Section "Device"
        Identifier      "Warp"
        Driver          "warp"
        Option          "fbdev" "/dev/fb0"
        # Option        "AccelText" "off"	# text in software
        # Option        "DeferFills" "off"	# fills by the blitter at once
        # Option        "Debug" "on"		# timings in the stats line
EndSection

Section "Screen"
	Identifier	"Screen0"
	Device		"Warp"
	Monitor		"Monitor0"
	DefaultDepth	16
	SubSection "Display"
		Depth		16
		Modes		"1024x768"
		Visual		"TrueColor"
	EndSubSection
EndSection

Section "Monitor"
	Identifier	"Monitor0"
EndSection



#Section "InputClass"

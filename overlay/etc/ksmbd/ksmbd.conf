; ksmbd: one public read-write share, /root/shared (see ksmbd.conf(5)).
; Anyone on the network can read and write it without a password; files
; written through it belong to root (/root is 0700, so the guest account
; could not reach the directory otherwise).
[global]
	workgroup = WORKGROUP
	server string = Warp Amiga
	guest account = nobody
	map to guest = bad user
	server min protocol = SMB2_10
	server signing = disabled

[shared]
	comment = Warp Amiga shared folder
	path = /root/shared
	read only = no
	guest ok = yes
	browseable = yes
	force user = root
	force group = root
	create mask = 0664
	directory mask = 0775

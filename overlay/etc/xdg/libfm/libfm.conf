# Warp desktop: no thumbnails (decoding images is slow on a 68060), icon
# sizes the Tango PNGs have (16/22/32: nothing to scale).
[config]
single_click=0
use_trash=0
confirm_del=1
confirm_trash=1
advanced_mode=0
si_unit=0
force_startup_notify=0
backup_as_hidden=1
no_usb_trash=1
no_child_non_expandable=0
show_full_names=0
only_user_templates=0
template_run_app=0
template_type_once=0
auto_selection_delay=600
drop_default_action=auto
defer_content_test=1
quick_exec=0
terminal=xterm -e %s
archiver=

[ui]
big_icon_size=32
small_icon_size=16
pane_icon_size=16
thumbnail_size=32
show_thumbnail=0
shadow_hidden=1

[places]
places_home=1
places_desktop=1
places_root=1
places_computer=0
places_trash=0
places_applications=0
places_network=0
places_unmounted=1
